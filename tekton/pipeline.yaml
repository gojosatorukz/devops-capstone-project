#
# This pipeline needs the following tasks from Tekton Catalog
#   - git-clone
#   - flake8
#
---
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:  
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: build-image
      description: Fully qualified target image in the OpenShift registry.
  tasks:
    - name: init
      workspaces:
        - name: source
          workspace: pipeline-workspace          
      taskRef:
        name: cleanup

    - name: clone
      workspaces:
        - name: output
          workspace: pipeline-workspace          
      taskRef:
        name: git-clone
      params:
      - name: url
        value: $(params.repo-url)
      - name: revision
        value: $(params.branch)
      runAfter:
        - init
    - name: lint
      runAfter: [clone]
      taskRef:
        name: flake8
      params:
        - name: requirements_file
          value: ""
        - name: args
          value: ["--max-line-length=127", "--max-complexity=10"]
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: tests
      runAfter: [clone]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
    - name: build
      runAfter: [lint, tests]
      taskRef:
        kind: ClusterTask
        name: buildah
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: IMAGE
          value: $(params.build-image)
    - name: deploy
      runAfter: [build]
      taskRef:
        kind: ClusterTask
        name: openshift-client
      workspaces:
        - name: manifest-dir
          workspace: pipeline-workspace
      params:
        - name: SCRIPT
          value: |
            set -eu
            sed "s|image: accounts:1|image: $(params.build-image)|" deploy/deployment.yaml |
              oc apply -f -
            oc apply -f deploy/service.yaml -f deploy/route.yaml
            oc rollout status deployment/accounts --timeout=120s
            oc get pods -l app=accounts
